# Solo para desarrollo en local: un PostgreSQL en 127.0.0.1:5432 (no se ve desde la red; otro puerto: DEV_DB_PORT=5433).
#   docker compose -f compose.dev.yml up -d
# Crea dos bases de datos: "grocery" (la de npm run dev) y "grocery_test" (la de los tests, se borra en cada pasada).
# Producción: deploy/compose.yml.
name: grocery-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./server/test/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 2s
      retries: 30

volumes:
  db-data:
