name: CI

# Runs on GitHub's own runners, never on the homelab. Deploy calls it too (workflow_call),
# so nothing reaches production without passing it.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_docker:
        description: Skip the Docker image build (Deploy builds and pushes it itself)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Web tests (translations)
        run: npm run test:web

  test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery -d grocery_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://grocery:grocery@localhost:5432/grocery_test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (server, production deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - name: npm audit (web)
        run: npm audit --audit-level=high
        working-directory: web

  docker:
    name: Build the Docker image
    if: ${{ !inputs.skip_docker }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
