name: Deploy

# Every push to main runs CI, builds the image, pushes it to GitHub Container Registry
# and the homelab's isolated runner asks a root-owned script on the server to deploy it.
# The "production" environment must be limited to the main branch (Settings -> Environments),
# with a required reviewer, so no other branch can reach the runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/davidniin/grocery-list

jobs:
  ci:
    name: CI
    if: github.repository == 'davidniin/grocery-list' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      skip_docker: true
    permissions:
      contents: read

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the homelab
    needs: build
    # Isolated runner: user gr-grocery, no Docker and no sudo except the one root-owned script below.
    runs-on: [self-hosted, gr-grocery]
    permissions: {}
    environment:
      name: production
      url: https://grocery-list.davidnin.dev
    steps:
      # No checkout: no code from this repo runs on the homelab. The script only receives the commit
      # hash and deploys that image with the compose file kept on the server (see deploy/README.md).
      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: sudo -n /usr/local/sbin/deploy-grocery "$IMAGE_TAG"
